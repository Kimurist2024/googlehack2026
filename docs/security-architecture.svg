<text x="80" y="765.95" font-size="15" fill="#55626a">・誰が・いつ・何をしたか</text>
<text x="80" y="787.7" font-size="15" fill="#55626a">・CSV の持ち出しとパッケージの発行</text>
<text x="80" y="809.45" font-size="15" fill="#55626a">・入室の失敗と上限超え</text>
