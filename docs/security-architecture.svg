<text x="490" y="765.95" font-size="15" fill="#55626a">・授業・個人コードは鍵付きハッシュ</text>
<text x="490" y="787.7" font-size="15" fill="#55626a">・30日で TTL 削除、期限後は API も 404</text>
<text x="490" y="809.45" font-size="15" fill="#55626a">・教員がクラス・課題をすぐに消せる</text>
