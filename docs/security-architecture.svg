<rect x="952" y="446" width="5" height="146" rx="2" fill="#f0b44c"/>
<text x="970" y="465" font-size="17" font-weight="700" fill="#1f2a30">隔離環境の中の実行ラッパー（多層防御）</text>
<text x="970" y="489.95" font-size="15" fill="#55626a">・import は計算用の標準ライブラリだけ</text>
<text x="970" y="511.7" font-size="15" fill="#55626a">・__import__・open・eval・特殊な属性（__class__ など）を拒否</text>
<text x="970" y="533.45" font-size="15" fill="#55626a">・子プロセスに環境変数を渡さない（秘密が届かない）</text>
<text x="970" y="555.2" font-size="15" fill="#55626a">・メモリ 512MB・CPU時間・ファイルの大きさに上限</text>
