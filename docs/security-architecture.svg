<rect width="1600" height="900" fill="#efefef"/>
<text x="40" y="78" font-size="46" font-weight="700" fill="#1f2a30">セキュリティ構成：</text>
<text x="462.0" y="76" font-size="20" fill="#55626a">信用しないデータを、層を重ねて守る</text>
