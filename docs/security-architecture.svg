<text x="80" y="483.95" font-size="15" fill="#55626a">・許可リストにある確認済みの</text>
<text x="80" y="505.7" font-size="15" fill="#55626a">・アカウントだけを通す</text>
<rect x="62" y="548" width="316" height="56" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="62" y="558" width="5" height="36" rx="2" fill="#4a86e8"/>
<text x="80" y="576" font-size="16" font-weight="700" fill="#1f2a30">Service Worker は画面だけ保存</text>
