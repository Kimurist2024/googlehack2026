<g transform="translate(1514,150) scale(1.0769230769230769)" fill="none" stroke="#f2a7a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-12" width="28" height="19" rx="6"/><path d="M-6,7 L-10,13 L1,7"/><circle cx="-6" cy="-2.5" r="1.6" fill="#f2a7a7"/><circle cx="0" cy="-2.5" r="1.6" fill="#f2a7a7"/><circle cx="6" cy="-2.5" r="1.6" fill="#f2a7a7"/></g>
