<text x="78" y="157" font-size="22" font-weight="700" fill="#ffffff">ブラウザ（生徒・教員）</text>
<circle cx="374.0" cy="150" r="28" fill="#ffffff" stroke="#4a86e8" stroke-width="3"/>
<g transform="translate(374.0,150) scale(1.0769230769230769)" fill="none" stroke="#4a86e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-15" y="-12" width="30" height="24" rx="4"/><path d="M-15,-5 H15"/><circle cx="-10" cy="-8.5" r="1.4" fill="#4a86e8"/><circle cx="-6" cy="-8.5" r="1.4" fill="#4a86e8"/><circle cx="-2" cy="-8.5" r="1.4" fill="#4a86e8"/></g>
