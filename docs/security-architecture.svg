<text x="80" y="215" font-size="17" font-weight="700" fill="#1f2a30">画面（Firebase Hosting）</text>
<text x="80" y="239.95" font-size="15" fill="#55626a">・Strict CSP ＋ Trusted Types</text>
<text x="80" y="261.7" font-size="15" fill="#55626a">・表示は textContent（XSS対策）</text>
<rect x="62" y="316" width="316" height="100" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="62" y="326" width="5" height="80" rx="2" fill="#4a86e8"/>
<text x="80" y="345" font-size="17" font-weight="700" fill="#1f2a30">通信とフレーム</text>
<text x="80" y="369.95" font-size="15" fill="#55626a">・HSTS（HTTPS を強制）</text>
<text x="80" y="391.7" font-size="15" fill="#55626a">・X-Frame-Options（乗っ取り対策）</text>
<rect x="62" y="430" width="316" height="104" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="62" y="440" width="5" height="84" rx="2" fill="#4a86e8"/>
