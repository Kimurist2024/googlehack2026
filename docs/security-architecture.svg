<rect x="472" y="538" width="5" height="56" rx="2" fill="#1fae8f"/>
<text x="490" y="557" font-size="17" font-weight="700" fill="#1f2a30">監査ログ（Cloud Logging）</text>
<text x="490" y="581.95" font-size="15" fill="#55626a">・コード・トークン・IP は書かない</text>
