<text x="1310" y="741" font-size="17" font-weight="700" fill="#1f2a30">障害時に引き継ぐ</text>
<text x="1310" y="765.95" font-size="14" fill="#55626a">・署名を確かめて取り込む</text>
<text x="1310" y="786.25" font-size="14" fill="#55626a">・外へは一度も接続しない</text>
<text x="1310" y="806.55" font-size="14" fill="#55626a">・教員の操作は教員PCだけ</text>
