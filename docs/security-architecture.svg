<rect x="472" y="128" width="234.39999999999998" height="42" fill="#6fe0cf"/>
<text x="488" y="157" font-size="22" font-weight="700" fill="#1f2a30">API（Cloud Run）</text>
<circle cx="834" cy="150" r="28" fill="#ffffff" stroke="#1fae8f" stroke-width="3"/>
<g transform="translate(834,150) scale(1.0769230769230769)" fill="none" stroke="#1fae8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-13" width="28" height="11" rx="2.5"/><rect x="-14" y="2" width="28" height="11" rx="2.5"/><circle cx="9" cy="-7.5" r="1.6" fill="#1fae8f"/><circle cx="9" cy="7.5" r="1.6" fill="#1fae8f"/><path d="M-9,-7.5 H2 M-9,7.5 H2"/></g>
