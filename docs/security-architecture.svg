<text x="490" y="215" font-size="17" font-weight="700" fill="#1f2a30">入口で断る</text>
<text x="490" y="239.95" font-size="15" fill="#55626a">・本文の大きさ・IDの形・文字数の上限</text>
<text x="490" y="261.7" font-size="15" fill="#55626a">・API の一覧（/docs）を本番で隠す</text>
<rect x="472" y="300" width="386" height="116" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="472" y="310" width="5" height="96" rx="2" fill="#1fae8f"/>
<text x="490" y="329" font-size="17" font-weight="700" fill="#1f2a30">認証</text>
<text x="490" y="353.95" font-size="15" fill="#55626a">・生徒トークンは HMAC で署名・期限つき</text>
<text x="490" y="375.7" font-size="15" fill="#55626a">・鍵は用途ごとに導出（HKDF）</text>
<rect x="472" y="430" width="386" height="84" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="472" y="440" width="5" height="64" rx="2" fill="#1fae8f"/>
<text x="490" y="459" font-size="17" font-weight="700" fill="#1f2a30">入室の総当たり対策</text>
<text x="490" y="483.95" font-size="15" fill="#55626a">・失敗だけを接続元ごとに共有して数える</text>
