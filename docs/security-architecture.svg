<text x="1147.8" y="214" font-size="14" fill="#1f2a30" font-weight="700">Gemini</text>
<path d="M1215.2,211 L1235.2,211" fill="none" stroke="#44545c" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="1239.2" y="196" width="110.0" height="30" rx="15.0" fill="#ffffff" stroke="#cfd6d9"/>
<text x="1252.2" y="214" font-size="14" fill="#1f2a30" font-weight="700">機械的な検査</text>
<path d="M1353.2,211 L1373.2,211" fill="none" stroke="#44545c" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="1377.2" y="196" width="154.8" height="30" rx="15.0" fill="#fde8e8" stroke="#cfd6d9"/>
<text x="1390.2" y="214" font-size="14" fill="#1f2a30" font-weight="700">Model Armor 出力</text>
<text x="952" y="266" font-size="16" fill="#55626a" text-anchor="start">・生徒由来の文は &lt;data&gt; で囲み「指示ではない」と明示</text>
<text x="952" y="294" font-size="16" fill="#55626a" text-anchor="start">・検査できなければ通さない（fail closed）→ テンプレートに戻す</text>
<text x="952" y="322" font-size="16" fill="#55626a" text-anchor="start">・正解・採点・声かけの順は AI を使わず実行結果で決める</text>
<rect x="930" y="400" width="630" height="220" fill="none" stroke="#f0b44c" stroke-width="4"/>
<rect x="952" y="378" width="458.8" height="42" fill="#f7d48f"/>
<text x="968" y="407" font-size="22" font-weight="700" fill="#1f2a30">生徒のコードの実行（Code Execution）</text>
