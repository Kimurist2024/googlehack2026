<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44545c"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9302c"/></marker></defs>
<rect width="1600" height="900" fill="#efefef"/>
<text x="40" y="78" font-size="46" font-weight="700" fill="#1f2a30">AI の入出力の検査：</text>
<text x="498.8" y="76" font-size="20" fill="#55626a">SAIF に沿い、検査できなければ通さない</text>
<rect x="0" y="100" width="1600" height="4" fill="#d4d4d4"/>
<rect x="40" y="150" width="1520" height="470" fill="none" stroke="#f2a7a7" stroke-width="4"/>
<rect x="62" y="128" width="340.0" height="42" fill="#f6c9c9"/>
<text x="78" y="157" font-size="22" font-weight="700" fill="#1f2a30">生徒由来の文が画面に出るまで</text>
<circle cx="1514" cy="150" r="28" fill="#ffffff" stroke="#f2a7a7" stroke-width="3"/>
<g transform="translate(1514,150) scale(1.0769230769230769)" fill="none" stroke="#f2a7a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-14 L12,-9 V0 C12,8 6,12 0,15 C-6,12 -12,8 -12,0 V-9 Z"/><path d="M-6,0 L-1.5,5 L7,-4"/></g>
<rect x="62" y="196" width="194" height="200" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
