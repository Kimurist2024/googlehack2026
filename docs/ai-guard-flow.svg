<text x="80" y="224" font-size="16" font-weight="700" fill="#1f2a30">生徒の入力</text>
<text x="80" y="247.6" font-size="15" fill="#55626a">・コードと答え</text>
<text x="80" y="269.35" font-size="15" fill="#55626a">・信用しないデー</text>
<text x="80" y="291.1" font-size="15" fill="#55626a">　タとして扱う</text>
<path d="M260,296 L286,296" fill="none" stroke="#44545c" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="290" y="196" width="194" height="200" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="290" y="206" width="5" height="180" rx="2" fill="#8a9aa3"/>
<text x="308" y="224" font-size="16" font-weight="700" fill="#1f2a30">減らして囲む</text>
<text x="308" y="247.6" font-size="15" fill="#55626a">・コメントを消す</text>
<text x="308" y="269.35" font-size="15" fill="#55626a">・答えは先頭200字</text>
<text x="308" y="291.1" font-size="15" fill="#55626a">・&lt;data&gt; で囲む</text>
<path d="M488,296 L514,296" fill="none" stroke="#44545c" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="518" y="196" width="194" height="200" rx="10" fill="#ffffff" stroke="#cfd6d9"/>
<rect x="518" y="206" width="5" height="180" rx="2" fill="#d9534f"/>
<circle cx="688" cy="222" r="17" fill="#ffffff" stroke="#d9534f" stroke-width="3"/>
<g transform="translate(688,222) scale(0.6538461538461539)" fill="none" stroke="#d9534f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-14 L12,-9 V0 C12,8 6,12 0,15 C-6,12 -12,8 -12,0 V-9 Z"/><path d="M-6,0 L-1.5,5 L7,-4"/></g>
<text x="536" y="224" font-size="16" font-weight="700" fill="#1f2a30">Model Armor </text>
<text x="536" y="245.6" font-size="16" font-weight="700" fill="#1f2a30">入力</text>
<text x="536" y="269.2" font-size="15" fill="#55626a">・プロンプト注入</text>
<text x="536" y="290.95" font-size="15" fill="#55626a">・ジェイルブレイ</text>
<text x="536" y="312.7" font-size="15" fill="#55626a">　ク</text>
<text x="536" y="334.45" font-size="15" fill="#55626a">・有害・悪意URL</text>
<text x="536" y="356.2" font-size="15" fill="#55626a">　・機密</text>
<path d="M716,296 L742,296" fill="none" stroke="#44545c" stroke-width="3.5" marker-end="url(#arrow)"/>
<path d="M615.0,398 L615.0,498" fill="none" stroke="#c9302c" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
